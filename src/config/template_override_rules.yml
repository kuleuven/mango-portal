---
zone: cold

collection_home_realm:
  source: common/collection_view.html.j2
  target: cold_storage/project_view.html.j2
  matches:
    all:
      depth: 3

cold_sidebar:
  source: sidebar.html.j2
  target: cold_storage/cold_sidebar.html.j2
  matches: always

cold_index:
  source: user_tantra/index.html.j2
  target: cold_storage/index.html.j2
  matches: always
  
---
zone: icts_demo

# collection_view_iot:
#   source: collection_view
#   target: collection_iot.html.j2
#   matches:
#     always: true
---
zone: all

collection_home_simple:
  source: common/collection_view.html.j2
  target: common/collection_view_content_only.html.j2
  matches:
    any:
      path: '/{{zone}}/home'

gallery_carrousel:
  source: common/collection_view.html.j2
  target: common/gallery_carrousel.html.j2
  matches:
    all:
      metadata:
        match_type: any
        items:
          - mg.collection_type: gallery_carrousel
collection_view_trash:
  source: common/collection_view.html.j2
  target: common/collection_view_trash.html.j2
  matches:
    all:
      subtree: '/{{zone}}/trash' #quotes needed as in principle {} are special characters
object_view_trash:
  source: common/object_view.html.j2
  target: common/object_view_trash.html.j2
  matches:
    all:
      subtree: '/{{zone}}/trash'

realm_powered_side_bar:
  source: sidebar.html.j2
  target: user_tantra/sidebar.html.j2
  matches: always

user_profile:
  source: user/myprofile.html.j2
  target: mango_overrides/user/myprofile.html.j2
  matches: always

base_template_header:
  source: header.html.j2
  target: mango_overrides/header.html.j2
  matches: always

group_members:
  source: user/group_members.html.j2
  target: mango_overrides/user/group_members.html.j2
  matches: always

gallery_view_dayral_barsha:
  source: collection_content.html.j2
  target: collection_gallery.html.j2
  matches:
    all:
      subtree: '/{{zone}}/home/Dayral-Barsha' #quotes needed as in principle {} are special characters

gallery_view_search_dayral_barsha:
  source: search/basic_catalog_search.html.j2
  target: search/gallery_catalog_search.html.j2
  matches:
    all:
      subtree: '/{{zone}}/home/Dayral-Barsha' #quotes needed as in principle {} are special characters