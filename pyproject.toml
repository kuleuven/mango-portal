[project]
name = "mango-portal"
version = "0.50.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Borgermans", email = "paul.borgermans@kuleuven.be" }
]
requires-python = ">=3.12"
dependencies = [
    "bootstrap-flask>=2.5.0",
    "distinctipy>=1.3.4",
    "flask>=3.1.3",
    "flask-caching>=2.4.0",
    "flask-cors>=6.0.5",
    "flask-paginate>=2024.4.12",
    "flask-session>=0.8.0",
    "flask-wtf>=1.3.0",
    "httpx>=0.28.1",
    "humanize>=4.15.0",
    "mango-mdconverter>=0.0.10",
    "multidict>=6.7.1",
    "nh3>=0.3.6",
    "oic>=1.7.0",
    "pandas>=3.0.3",
    "pdf2image>=1.17.0",
    "pillow>=12.2.0",
    "python-dateutil>=2.9.0.post0",
    "python-irodsclient>=3.3.0",
    "python-magic>=0.4.27",
    "pytz>=2026.2",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "semver>=3.0.4",
    "slugify>=0.0.1",
    "waitress>=3.0.2",
]

[project.scripts]
mango-portal = "mango_portal:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "flask-debugtoolbar>=0.16.0",
]
